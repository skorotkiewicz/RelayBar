name: Release RelayBar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          artifact="relaybar-${ref}-x86_64-unknown-linux-gnu"
          mkdir -p "$artifact/assets"
          cp target/release/relaybar README.md LICENSE "$artifact/"
          cp assets/relaybar.desktop "$artifact/assets/"
          tar -czf "$artifact.tar.gz" "$artifact"

      - uses: actions/upload-artifact@v4
        with:
          name: relaybar-x86_64-unknown-linux-gnu
          path: relaybar-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relaybar-x86_64-unknown-linux-gnu

      - uses: softprops/action-gh-release@v2
        with:
          files: relaybar-*.tar.gz
          generate_release_notes: true

  aur-publish:
    name: Publish to AUR
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - uses: actions/checkout@v4

      - name: Set up package builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh pacman-contrib sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Update PKGBUILD
        run: |
          version=${GITHUB_REF#refs/tags/v}
          sed -i "s/^pkgver=.*/pkgver=$version/" arch/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' arch/PKGBUILD
          sudo -u builder bash -lc 'cd arch && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: relaybar-bin
          pkgbuild: ./arch/PKGBUILD
          assets: |
            ./arch/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
