name: Release RelayBar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          artifact="relaybar-rs-${ref}-x86_64-unknown-linux-gnu"
          mkdir "$artifact"
          cp target/release/relaybar-rs README.md "$artifact/"
          tar -czf "$artifact.tar.gz" "$artifact"

      - uses: actions/upload-artifact@v4
        with:
          name: relaybar-rs-x86_64-unknown-linux-gnu
          path: relaybar-rs-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relaybar-rs-x86_64-unknown-linux-gnu

      - uses: softprops/action-gh-release@v2
        with:
          files: relaybar-rs-*.tar.gz
          generate_release_notes: true
