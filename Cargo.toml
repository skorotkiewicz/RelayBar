[package]
name = "relaybar-rs"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "relaybar"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
